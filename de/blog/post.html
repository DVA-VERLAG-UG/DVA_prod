<!-- =========================================================
     FILE: /de/blog/post.html
     Blog post detail (auto from Google Sheet CSV) + header/footer
     ========================================================= -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Blogpost | DVAYD Publishing</title>
  <meta name="description" content="Blogpost von DVAYD Publishing." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Header + Footer (generated) -->
  <script src="/js/header.js" defer></script>
  <script src="/js/footer.js" defer></script>

  <!-- Pagefind (header search) -->
  <script src="/_pagefind/pagefind.js" defer></script>

  <style>
    :root{
      --post-max: 920px;
      --post-panel: rgba(255,255,255,.10);
      --post-panel2: rgba(255,255,255,.16);
      --post-border: rgba(255,255,255,.18);
      --post-ink: rgba(255,255,255,.96);
      --post-muted: rgba(255,255,255,.70);
      --post-shadow: 0 18px 50px rgba(0,0,0,.45);
      --post-radius: 18px;
    }

    .post-wrap{
      width: min(var(--post-max), calc(100% - 48px));
      margin: 0 auto;
      padding: calc(var(--hdr-h,72px) + 38px) 0 84px;
    }

    .post-back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color: var(--post-ink);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      padding: 10px 12px;
      border-radius: 12px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      margin-bottom: 14px;
    }
    .post-back:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: rgba(139,92,246,.55);
    }

    .post-hero{
      background: linear-gradient(180deg, var(--post-panel2), var(--post-panel));
      border: 1px solid var(--post-border);
      border-radius: var(--post-radius);
      overflow:hidden;
      box-shadow: var(--post-shadow);
    }

    .post-cover{
      width:100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display:none;
      background: rgba(255,255,255,.06);
    }

    .post-head{
      padding: 18px 18px 16px;
    }

    .post-title{
      margin: 0;
      font-size: clamp(26px, 3.8vw, 40px);
      line-height: 1.1;
      letter-spacing: .2px;
      color: var(--post-ink);
    }

    .post-meta{
      margin-top: 10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      color: var(--post-muted);
      font-size: 13px;
    }

    .post-pill{
      border: 1px solid rgba(255,255,255,.18);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.82);
      font-size: 12px;
    }

    .post-body{
      margin-top: 16px;
      padding: 22px 18px 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      box-shadow: 0 16px 46px rgba(0,0,0,.28);
    }

    .post-body :where(h2,h3){
      margin: 18px 0 10px;
      line-height: 1.2;
    }

    .post-body :where(p,ul,ol){
      margin: 0 0 12px;
      color: rgba(255,255,255,.86);
      line-height: 1.65;
      font-size: 15px;
    }

    .post-body a{
      color: rgba(199,210,254,.95);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-state{
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.22);
      color: var(--post-muted);
      background: rgba(255,255,255,.06);
    }

    @media (max-width: 640px){
      .post-wrap{ width: min(var(--post-max), calc(100% - 28px)); padding-top: calc(var(--hdr-h,72px) + 24px); }
      .post-head{ padding: 16px 14px 14px; }
      .post-body{ padding: 18px 14px 16px; }
    }
  </style>
</head>

<body>
  <header id="site-header"></header>

  <main>
    <section class="post-wrap">
      <a class="post-back" href="/de/blog/">
        <span aria-hidden="true">←</span> Zurück zum Blog
      </a>

      <div id="state" class="post-state">Lade Beitrag …</div>

      <article id="article" class="post-hero" style="display:none;">
        <img id="cover" class="post-cover" alt="">
        <div class="post-head">
          <h1 id="title" class="post-title"></h1>
          <div id="meta" class="post-meta"></div>
        </div>
      </article>

      <section id="content" class="post-body" style="display:none;"></section>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script>
    /* ===========================
       CONFIG – same CSV as list page
       =========================== */
    const SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vS4g1gNsiyY4k2A052LR7EaVUYFqrWGWNITOPqw5bGG_PTogiP84C44VQJpKn-HC2vxHin4fTy_puU0/pub?gid=0&single=true&output=csv";

    /*
      First row headers expected:
      slug,title,excerpt,content,date,author,cover,tags
      NOTE: content is treated as HTML (inserted via innerHTML).
            Only put trusted HTML into the sheet.
    */

    const slug = new URLSearchParams(location.search).get("slug");

    const els = {
      state: document.getElementById("state"),
      article: document.getElementById("article"),
      cover: document.getElementById("cover"),
      title: document.getElementById("title"),
      meta: document.getElementById("meta"),
      content: document.getElementById("content"),
    };

    function esc(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function norm(s){
      return String(s ?? "").toLowerCase().trim();
    }

    function splitTags(s){
      return String(s ?? "")
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);
    }

    // Robust CSV parser (handles quotes/commas/newlines)
    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;

      for(let i=0;i<text.length;i++){
        const c = text[i];
        const n = text[i+1];

        if(inQuotes){
          if(c === '"' && n === '"'){ cur += '"'; i++; }
          else if(c === '"'){ inQuotes = false; }
          else { cur += c; }
        } else {
          if(c === '"'){ inQuotes = true; }
          else if(c === ","){ row.push(cur); cur=""; }
          else if(c === "\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
          else if(c === "\r"){ /* ignore */ }
          else { cur += c; }
        }
      }
      row.push(cur);
      rows.push(row);
      return rows.filter(r => r.some(cell => String(cell).trim() !== ""));
    }

    function setMetaDescription(desc){
      let m = document.querySelector('meta[name="description"]');
      if(!m){
        m = document.createElement("meta");
        m.setAttribute("name","description");
        document.head.appendChild(m);
      }
      m.setAttribute("content", desc);
    }

    function renderPost(p){
      document.title = `${p.title} | DVAYD Blog`;
      setMetaDescription(p.excerpt || "Blogpost von DVAYD Publishing.");

      els.title.textContent = p.title;

      const metaBits = [];
      if(p.date) metaBits.push(`<span>${esc(p.date)}</span>`);
      if(p.author) metaBits.push(`<span>·</span><span>${esc(p.author)}</span>`);
      (p.tags || []).forEach(t => metaBits.push(`<span class="post-pill">${esc(t)}</span>`));
      els.meta.innerHTML = metaBits.join(" ");

      if(p.cover){
        els.cover.src = p.cover;
        els.cover.alt = p.title;
        els.cover.style.display = "block";
      }

      // content is treated as HTML (trusted)
      els.content.innerHTML = p.content || "";

      els.state.style.display = "none";
      els.article.style.display = "block";
      els.content.style.display = "block";
    }

    (async function init(){
      if(!slug){
        els.state.textContent = "Kein Beitrag gewählt. Bitte gehe zurück zur Blog-Übersicht.";
        return;
      }

      try{
        els.state.textContent = "Lade Beitrag …";

        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        const csv = await res.text();

        const rows = parseCSV(csv);
        if(rows.length < 2) throw new Error("CSV has no data rows");

        const header = rows[0].map(h => norm(h));
        const idx = (name) => header.indexOf(norm(name));

        const iSlug = idx("slug");
        const iTitle = idx("title");
        const iExcerpt = idx("excerpt");
        const iContent = idx("content");
        const iDate = idx("date");
        const iAuthor = idx("author");
        const iCover = idx("cover");
        const iTags = idx("tags");

        if(iSlug === -1 || iTitle === -1) throw new Error("Missing required headers: slug, title");
        if(iContent === -1) throw new Error("Missing required header: content");

        const posts = rows.slice(1).map(r => ({
          slug:   r[iSlug] || "",
          title:  r[iTitle] || "",
          excerpt:r[iExcerpt] || "",
          content:r[iContent] || "",
          date:   r[iDate] || "",
          author: r[iAuthor] || "",
          cover:  r[iCover] || "",
          tags:   splitTags(r[iTags] || ""),
        }))
        .filter(p => p.slug && p.title);

        const post = posts.find(p => p.slug === slug);

        if(!post){
          els.state.textContent = "Beitrag nicht gefunden. Prüfe den slug in der URL und im Sheet.";
          return;
        }

        renderPost(post);

      } catch(err){
        console.error(err);
        els.state.textContent =
          "Fehler beim Laden des Beitrags. Prüfe: (1) Sheet ist 'Published', (2) gid stimmt, (3) Header-Zeile heißt slug,title,excerpt,content,date,author,cover,tags.";
      }
    })();
  </script>
</body>
</html>
