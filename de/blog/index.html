<!-- =========================================================
     FILE: /de/blog/index.html
     Blog list (auto from Google Sheet CSV) + header/footer
     ========================================================= -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Blog | DVAYD Publishing</title>
  <meta name="description" content="Blog – Beiträge, Updates und Insights von DVAYD Publishing." />
  <link rel="canonical" href="https://www.dvayd.com/de/blog/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Header + Footer (generated) -->
  <script src="/js/header.js" defer></script>
  <script src="/js/footer.js" defer></script>

  <!-- Pagefind (header search) -->
  <script src="/_pagefind/pagefind.js" defer></script>

  <style>
    :root{
      --blog-max: 1180px;

      /* ✅ DEFAULT = LIGHT (heller Hintergrund + dunkle Schrift) */
      --blog-panel: rgba(15,23,42,.06);
      --blog-panel2: rgba(15,23,42,.10);
      --blog-border: rgba(15,23,42,.12);
      --blog-ink: rgba(15,23,42,.96);
      --blog-muted: rgba(15,23,42,.62);
      --blog-shadow: 0 18px 50px rgba(2,16,41,.12);

      --blog-radius: 18px;
    }

    /* ✅ DEFAULT: heller Seiten-Hintergrund (nur diese Seite) */
    body{
      background:
        radial-gradient(900px 520px at 15% 20%, rgba(139,92,246,.10), transparent 60%),
        radial-gradient(700px 420px at 85% 40%, rgba(99,102,241,.08), transparent 62%),
        #f6f7fb;
    }

    /* ✅ DIM MODE = DARK (dunkler Hintergrund + helle Schrift) */
    html[data-theme="dim"]{
      --blog-panel: rgba(255,255,255,.10);
      --blog-panel2: rgba(255,255,255,.16);
      --blog-border: rgba(255,255,255,.18);
      --blog-ink: rgba(255,255,255,.96);
      --blog-muted: rgba(255,255,255,.70);
      --blog-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    /* ✅ DIM MODE: dunkler Seiten-Hintergrund (nur diese Seite) */
    html[data-theme="dim"] body{
      background:
        radial-gradient(900px 520px at 15% 20%, rgba(139,92,246,.10), transparent 60%),
        radial-gradient(700px 420px at 85% 40%, rgba(99,102,241,.08), transparent 62%),
        #0b1220;
    }

    /* ✅ DEFAULT (LIGHT): harte Weißwerte überschreiben */
    .blog-state{
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed rgba(15,23,42,.18);
      color: var(--blog-muted);
      background: rgba(15,23,42,.05);
    }
    .blog-cover{
      aspect-ratio: 16/9; width:100%; display:block;
      background: rgba(15,23,42,.06);
      object-fit: cover;
    }
    .blog-pill{
      border: 1px solid rgba(15,23,42,.16);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,.06);
      color: rgba(15,23,42,.82);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .blog-btn{
      display:inline-flex; align-items:center; gap:8px; text-decoration:none; color: var(--blog-ink);
      background: rgba(15,23,42,.08);
      border: 1px solid rgba(15,23,42,.12);
      padding: 10px 12px;
      border-radius: 12px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      will-change: transform;
    }
    .blog-btn:hover{
      transform: translateY(-1px);
      background: rgba(15,23,42,.10);
      border-color: rgba(139,92,246,.45);
    }

    /* ✅ DIM MODE: harte Werte wieder „weiß“ machen */
    html[data-theme="dim"] .blog-state{
      border: 1px dashed rgba(255,255,255,.22);
      background: rgba(255,255,255,.06);
      color: var(--blog-muted);
    }
    html[data-theme="dim"] .blog-cover{
      background: rgba(255,255,255,.06);
    }
    html[data-theme="dim"] .blog-pill{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.82);
    }
    html[data-theme="dim"] .blog-btn{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      color: var(--blog-ink);
    }
    html[data-theme="dim"] .blog-btn:hover{
      background: rgba(255,255,255,.14);
      border-color: rgba(139,92,246,.55);
    }

    .blog-wrap{
      width: min(var(--blog-max), calc(100% - 48px));
      margin: 0 auto;
      padding: calc(var(--hdr-h,72px) + 38px) 0 84px;
    }

    .blog-hero{ display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin-bottom: 18px; }
    .blog-title{ margin:0; font-size: clamp(28px, 4.2vw, 44px); letter-spacing: .2px; color: var(--blog-ink); line-height:1.05; }
    .blog-sub{ margin: 10px 0 0; max-width: 72ch; color: var(--blog-muted); line-height: 1.55; font-size: 15px; }

    .blog-controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 22px 0 16px; }
    .blog-input, .blog-select{
      background: var(--blog-panel);
      border: 1px solid var(--blog-border);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--blog-ink);
      outline: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
    }
    .blog-input{ min-width: 240px; flex: 1; }
    .blog-select{ min-width: 180px; }
    .blog-count{ color: var(--blog-muted); font-size: 13px; margin-left:auto; }

    .blog-grid{ display:grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-top: 14px; }
    .blog-card{
      grid-column: span 4;
      background: linear-gradient(180deg, var(--blog-panel2), var(--blog-panel));
      border: 1px solid var(--blog-border);
      border-radius: var(--blog-radius);
      overflow:hidden;
      box-shadow: var(--blog-shadow);
      transform: translateZ(0);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .blog-card:hover{
      transform: translateY(-4px);
      border-color: rgba(139,92,246,.55);
      background: linear-gradient(180deg, rgba(139,92,246,.16), var(--blog-panel));
    }

    .blog-card-body{ padding: 14px 14px 16px; display:flex; flex-direction:column; gap:10px; min-height: 190px; }
    .blog-meta{ display:flex; gap:10px; align-items:center; color: var(--blog-muted); font-size: 12.5px; flex-wrap: wrap; }

    .blog-h2{ margin:0; font-size: 16px; line-height: 1.25; letter-spacing: .2px; color: var(--blog-ink); }
    .blog-excerpt{
      margin:0; color: var(--blog-muted); line-height: 1.45; font-size: 14px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .blog-row{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }

    @media (max-width: 980px){ .blog-card{ grid-column: span 6; } }
    @media (max-width: 640px){
      .blog-wrap{ width: min(var(--blog-max), calc(100% - 28px)); padding-top: calc(var(--hdr-h,72px) + 24px); }
      .blog-hero{ flex-direction: column; align-items: flex-start; }
      .blog-count{ margin-left: 0; }
      .blog-card{ grid-column: span 12; }
      .blog-input{ min-width: 0; }
    }
  </style>
</head>

<body>
  <header id="site-header"></header>

  <main>
    <section class="blog-wrap" id="top">
      <div class="blog-hero">
        <div>
          <h1 class="blog-title">Blog</h1>
          <p class="blog-sub">Neue Beiträge erscheinen automatisch, sobald sie im Google Sheet hinzugefügt werden.</p>
        </div>
      </div>

      <div class="blog-controls">
        <input id="q" class="blog-input" type="search" placeholder="Suchen (Titel / Teaser / Tags) …" autocomplete="off" />
        <select id="tag" class="blog-select">
          <option value="">Alle Tags</option>
        </select>
        <div id="count" class="blog-count"></div>
      </div>

      <div id="state" class="blog-state">Lade Beiträge …</div>
      <section id="grid" class="blog-grid" aria-live="polite"></section>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script>
    /* ===========================
       CONFIG – your published CSV link
       =========================== */
    const SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vS4g1gNsiyY4k2A052LR7EaVUYFqrWGWNITOPqw5bGG_PTogiP84C44VQJpKn-HC2vxHin4fTy_puU0/pub?gid=0&single=true&output=csv";

    /*
      First row headers expected:
      slug,title,excerpt,content,date,author,cover,tags
    */

    const els = {
      q: document.getElementById("q"),
      tag: document.getElementById("tag"),
      count: document.getElementById("count"),
      state: document.getElementById("state"),
      grid: document.getElementById("grid"),
    };

    let ALL = [];

    function esc(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function norm(s){
      return String(s ?? "").toLowerCase().trim();
    }

    function splitTags(s){
      return String(s ?? "")
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);
    }

    // Robust CSV parser (handles quotes/commas/newlines)
    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;

      for(let i=0;i<text.length;i++){
        const c = text[i];
        const n = text[i+1];

        if(inQuotes){
          if(c === '"' && n === '"'){ cur += '"'; i++; }
          else if(c === '"'){ inQuotes = false; }
          else { cur += c; }
        } else {
          if(c === '"'){ inQuotes = true; }
          else if(c === ","){ row.push(cur); cur=""; }
          else if(c === "\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
          else if(c === "\r"){ /* ignore */ }
          else { cur += c; }
        }
      }
      row.push(cur);
      rows.push(row);
      return rows.filter(r => r.some(cell => String(cell).trim() !== ""));
    }

    function fillTagDropdown(posts){
      const tags = new Set();
      posts.forEach(p => (p.tags || []).forEach(t => tags.add(t)));
      const sorted = Array.from(tags).sort((a,b)=>a.localeCompare(b, "de"));

      els.tag.innerHTML =
        `<option value="">Alle Tags</option>` +
        sorted.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
    }

    function render(posts){
      if(!posts.length){
        els.grid.innerHTML = "";
        els.state.textContent = "Keine Beiträge gefunden.";
        els.state.style.display = "block";
        els.count.textContent = "";
        return;
      }

      els.state.style.display = "none";
      els.count.textContent = `${posts.length} Beitrag${posts.length === 1 ? "" : "e"}`;

      els.grid.innerHTML = posts.map(p => `
        <article class="blog-card">
          ${p.cover
            ? `<img class="blog-cover" src="${esc(p.cover)}" alt="">`
            : `<div class="blog-cover" aria-hidden="true"></div>`
          }
          <div class="blog-card-body">
            <div class="blog-meta">
              ${p.date ? `<span>${esc(p.date)}</span>` : ``}
              ${p.author ? `<span>·</span><span>${esc(p.author)}</span>` : ``}
              ${p.tags?.[0]
                ? `<span class="blog-pill" title="${esc(p.tags.join(", "))}">
                    ${esc(p.tags[0])}${p.tags.length>1 ? " +" + (p.tags.length-1) : ""}
                   </span>`
                : ``
              }
            </div>

            <h2 class="blog-h2">${esc(p.title)}</h2>
            <p class="blog-excerpt">${esc(p.excerpt || "")}</p>

            <div class="blog-row">
              <a class="blog-btn" href="/de/blog/post.html?slug=${encodeURIComponent(p.slug)}">
                Lesen <span aria-hidden="true">→</span>
              </a>
            </div>
          </div>
        </article>
      `).join("");
    }

    function applyFilters(){
      const q = norm(els.q.value);
      const tag = els.tag.value;

      let out = ALL;

      if(tag){
        out = out.filter(p => (p.tags || []).includes(tag));
      }
      if(q){
        out = out.filter(p => {
          const hay = norm([p.title, p.excerpt, (p.tags||[]).join(" ")].join(" "));
          return hay.includes(q);
        });
      }

      render(out);
    }

    (async function init(){
      try{
        els.state.textContent = "Lade Beiträge …";

        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        const csv = await res.text();

        const rows = parseCSV(csv);
        if(rows.length < 2) throw new Error("CSV has no data rows");

        const header = rows[0].map(h => norm(h));
        const idx = (name) => header.indexOf(norm(name));

        const iSlug = idx("slug");
        const iTitle = idx("title");
        const iExcerpt = idx("excerpt");
        const iDate = idx("date");
        const iAuthor = idx("author");
        const iCover = idx("cover");
        const iTags = idx("tags");

        if(iSlug === -1 || iTitle === -1) throw new Error("Missing required headers: slug, title");

        const posts = rows.slice(1).map(r => ({
          slug:   r[iSlug] || "",
          title:  r[iTitle] || "",
          excerpt:r[iExcerpt] || "",
          date:   r[iDate] || "",
          author: r[iAuthor] || "",
          cover:  r[iCover] || "",
          tags:   splitTags(r[iTags] || ""),
        }))
        .filter(p => p.slug && p.title);

        posts.sort((a,b) => (b.date || "").localeCompare(a.date || ""));

        ALL = posts;
        fillTagDropdown(ALL);
        render(ALL);

        els.q.addEventListener("input", applyFilters);
        els.tag.addEventListener("change", applyFilters);

      } catch(err){
        console.error(err);
        els.grid.innerHTML = "";
        els.state.style.display = "block";
        els.state.textContent =
          "Fehler beim Laden der Beiträge. Prüfe: (1) Sheet ist 'Published', (2) gid stimmt, (3) Header heißt slug,title,excerpt,content,date,author,cover,tags.";
      }
    })();
  </script>
</body>
</html>
